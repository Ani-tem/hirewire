name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hirewire
          POSTGRES_PASSWORD: hirewire
          POSTGRES_DB: hirewire_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hirewire" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://hirewire:hirewire@localhost:5432/hirewire_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both architectures: the free Oracle VM is ARM, most other servers are x86.
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ani-tem/hirewire:latest
            ghcr.io/ani-tem/hirewire:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

