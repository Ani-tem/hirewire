name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hirewire
          POSTGRES_PASSWORD: hirewire
          POSTGRES_DB: hirewire_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hirewire" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://hirewire:hirewire@localhost:5432/hirewire_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both architectures: the free Oracle VM is ARM, most other servers are x86.
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ani-tem/hirewire:latest
            ghcr.io/ani-tem/hirewire:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Off until the server exists: set the repository variable DEPLOY_ENABLED=true.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy # never two deploys at once
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: refuse to deploy to a machine pretending to be ours.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Ship compose file and restart
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          scp compose.prod.yml "$TARGET:hirewire/compose.prod.yml"
          # up -d stops the old container before starting the new one: two bots
          # polling Telegram with one token would get 409 Conflict.
          ssh "$TARGET" 'cd hirewire && docker compose -f compose.prod.yml pull hirewire && docker compose -f compose.prod.yml up -d && docker image prune -f'
